<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --surface: #161618;
      --border: #2a2a2e;
      --accent: #f0c040;
      --accent2: #e05a2b;
      --text: #f0ede8;
      --muted: #7a7875;
      --radius: 12px;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.35;
    }

    header {
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      flex-shrink: 0;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
    }

    .logo-mark {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 18px; height: 18px; }

    header h1 {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .file-chip {
      display: flex; align-items: center; gap: 8px;
      background: rgba(240,192,64,0.1);
      border: 1px solid rgba(240,192,64,0.25);
      border-radius: 6px;
      padding: 4px 12px;
      font-family: 'DM Mono', monospace;
      font-size: 0.73rem;
      color: var(--accent);
    }

    iframe#pdf-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
      display: block;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
  </div>
  <h1>Visualizador de PDF</h1>

  <div class="file-chip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
    Leitura Online
  </div>
</header>

<!-- O parâmetro #toolbar=0 avisa o navegador para esconder a barra de download/impressão -->
<iframe id="pdf-frame" src="b11.pdf#toolbar=0&zoom=185" title="b11.pdf"></iframe>

</body>
</html>
